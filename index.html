<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MercaCui | Cuidamos tu camino</title>

<link rel="icon" href="logo-mercacui.png">

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

:root{
    --azul:#063b82;
    --azul2:#0879e8;
    --verde:#22b719;
    --verde2:#55d62d;
    --blanco:#ffffff;
    --gris:#f3f6fa;
    --gris2:#dce4ee;
    --texto:#10233f;
    --rojo:#d62828;
    --amarillo:#f2a900;
}

body{
    background:var(--gris);
    color:var(--texto);
}

/* LOGIN */

#login{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px;
    background:
        linear-gradient(135deg,#ffffff,#eef7ff);
}

.login-box{
    background:white;
    width:100%;
    max-width:470px;
    padding:30px;
    border-radius:25px;
    box-shadow:0 15px 50px rgba(0,0,0,.15);
    text-align:center;
}

.login-logo{
    width:100%;
    max-width:390px;
    max-height:270px;
    object-fit:contain;
    margin-bottom:10px;
}

.login-box h1{
    color:var(--azul);
    margin-bottom:5px;
}

.login-box p{
    color:#65748a;
    margin-bottom:20px;
}

.form-group{
    text-align:left;
    margin-bottom:15px;
}

.form-group label{
    display:block;
    font-weight:bold;
    margin-bottom:6px;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid var(--gris2);
    border-radius:10px;
    outline:none;
}

input:focus,
select:focus,
textarea:focus{
    border-color:var(--azul2);
}

textarea{
    resize:vertical;
    min-height:100px;
}

button{
    border:none;
    cursor:pointer;
    border-radius:10px;
    padding:11px 16px;
    font-weight:bold;
}

.btn-primary{
    background:var(--azul2);
    color:white;
}

.btn-green{
    background:var(--verde);
    color:white;
}

.btn-danger{
    background:#ffe9e9;
    color:var(--rojo);
}

.btn-secondary{
    background:#eaf2fc;
    color:var(--azul);
}

.login-button{
    width:100%;
    margin-top:5px;
    font-size:16px;
}

.demo{
    background:#f3f7fc;
    padding:14px;
    margin-top:20px;
    border-radius:12px;
    font-size:13px;
    line-height:1.8;
}

/* APP */

.hidden{
    display:none!important;
}

.topbar{
    height:75px;
    background:white;
    border-bottom:1px solid var(--gris2);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 20px;
    position:sticky;
    top:0;
    z-index:1000;
}

.topbar-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.topbar-logo{
    height:58px;
    width:75px;
    object-fit:contain;
}

.brand-name{
    color:var(--azul);
    font-size:20px;
    font-weight:bold;
}

.role{
    color:#68788d;
    font-size:12px;
}

.topbar-right{
    display:flex;
    gap:8px;
}

/* LAYOUT */

.layout{
    display:grid;
    grid-template-columns:240px 1fr;
    min-height:calc(100vh - 75px);
}

.sidebar{
    background:white;
    border-right:1px solid var(--gris2);
    padding:15px;
}

.sidebar-title{
    font-size:11px;
    color:#7c8999;
    font-weight:bold;
    margin:15px 8px 8px;
    text-transform:uppercase;
}

.nav-button{
    width:100%;
    text-align:left;
    background:white;
    color:var(--texto);
    margin-bottom:5px;
}

.nav-button:hover,
.nav-button.active{
    background:#eaf3ff;
    color:var(--azul);
}

.content{
    padding:22px;
    min-width:0;
}

/* TITULOS */

.page-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:15px;
    margin-bottom:18px;
    flex-wrap:wrap;
}

.page-header h2{
    color:var(--azul);
}

.page-header p{
    color:#68788d;
    margin-top:5px;
}

.actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

/* CARDS */

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
    gap:15px;
}

.card{
    background:white;
    border:1px solid var(--gris2);
    border-radius:16px;
    padding:18px;
    box-shadow:0 5px 20px rgba(0,0,0,.04);
}

.card h3{
    color:var(--azul);
    margin-bottom:8px;
}

.stat strong{
    display:block;
    font-size:32px;
    color:var(--azul2);
}

.stat span{
    color:#68788d;
}

.section{
    margin-top:18px;
}

/* TABLAS */

.table-container{
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,
td{
    padding:11px;
    border-bottom:1px solid var(--gris2);
    text-align:left;
    white-space:nowrap;
}

th{
    color:#66768b;
    font-size:13px;
}

/* BADGES */

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    background:#eaf3ff;
    color:var(--azul);
    font-size:12px;
    font-weight:bold;
}

.badge.green{
    background:#e8f8e7;
    color:#168012;
}

.badge.red{
    background:#ffe9e9;
    color:#a51c1c;
}

.badge.yellow{
    background:#fff4d8;
    color:#966400;
}

/* MAPA */

#map{
    width:100%;
    height:500px;
    border-radius:15px;
    overflow:hidden;
    border:1px solid var(--gris2);
}

.map-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin:10px 0;
}

/* RUTA */

.route-info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:15px;
}

.route-point{
    background:#f4f7fb;
    padding:14px;
    border-radius:12px;
}

.route-point.start{
    border-left:5px solid var(--verde);
}

.route-point.end{
    border-left:5px solid var(--azul2);
}

.route-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:12px;
}

/* SOLICITUDES */

.request-card{
    border:1px solid var(--gris2);
    border-radius:12px;
    padding:14px;
    margin-bottom:10px;
    background:white;
}

.request-card h4{
    color:var(--azul);
}

.request-card small{
    color:#718095;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    z-index:3000;
}

.modal-box{
    background:white;
    width:100%;
    max-width:600px;
    max-height:90vh;
    overflow:auto;
    border-radius:18px;
    padding:22px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.close{
    background:#eee;
    font-size:20px;
}

/* NOTIFICACIONES */

.notification{
    padding:15px;
    border:1px solid var(--gris2);
    border-radius:12px;
    margin-bottom:10px;
    background:white;
}

.notification.unread{
    border-left:5px solid var(--verde);
}

/* TOAST */

#toast{
    position:fixed;
    bottom:20px;
    right:20px;
    background:#10233f;
    color:white;
    padding:13px 18px;
    border-radius:10px;
    opacity:0;
    pointer-events:none;
    transition:.3s;
    z-index:5000;
}

#toast.show{
    opacity:1;
}

/* MOBILE */

@media(max-width:850px){

    .layout{
        display:block;
    }

    .sidebar{
        position:fixed;
        bottom:0;
        left:0;
        width:100%;
        height:auto;
        z-index:2000;
        display:flex;
        overflow-x:auto;
        border-top:1px solid var(--gris2);
        border-right:0;
        padding:6px;
    }

    .sidebar-title{
        display:none;
    }

    .nav-button{
        min-width:max-content;
        width:auto;
        margin:0 3px;
    }

    .content{
        padding:12px;
        padding-bottom:80px;
    }

    .topbar{
        padding:7px 10px;
    }

    .topbar-logo{
        width:60px;
    }

    #map{
        height:430px;
    }

    .route-info{
        grid-template-columns:1fr;
    }
}

</style>
</head>

<body>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================================================
   MERCACUI

   ========================================================= */


/* =========================================================
   DATOS
   ========================================================= */

const CARTAGENA = [10.3997,-75.5144];

let datos = JSON.parse(
    localStorage.getItem("MERCACUI_DATOS")
) || {

    empresas:[
        {
            id:"empresa1",

            codigo:"MC-DEMO",

        }
    ],

    trabajadores:[
        {

        }
    ],

        {

    ],

    puntos:[

        {

        },

        {

        },

        {
            id:"punto3",
            empresaId:"empresa1",
            rutaId:"ruta1",
            tipo:"venta",
            nombre:"Tienda la Playita",
            descripcion:"Punto de venta",

            lng:-75.5205,

        }

    ],

    descansos:[

        {
            id:"descanso1",

            minutos:20,

        }

    ],

    capacitaciones:[

        {
            id:"cap1",

            titulo:"Capacitación Integral a Mercaderistas",
            tema:"Estrés laboral en vías y carreteras",
            fecha:"25 de septiembre",
            lugar:"Sede MercaCui Barrio Amberes"
        }

    ],

    solicitudes:[],

    notificaciones:[]

};


let usuarioActual = null;

let mapa = null;

let capaMarcadores = null;

let capaRuta = null;

let marcadorTrabajador = null;

let intervaloRuta = null;

let rutaActual = null;


/* =========================================================
   GUARDAR
   ========================================================= */

function guardar(){

    localStorage.setItem(
        "MERCACUI_DATOS",
        JSON.stringify(datos)
    );

}


/* =========================================================
   UTILIDADES
   ========================================================= */

function id(){

    return Date.now().toString()
    + Math.random().toString(36).substring(2);

}


function escapar(texto){

    return String(texto || "")
    .replace(/[&<>"']/g,function(c){

        return {

            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"

        }[c];

    });

}


function mostrarToast(mensaje){

    const toast =
    document.getElementById("toast");

    toast.textContent = mensaje;

    toast.classList.add("show");

    setTimeout(function(){

        toast.classList.remove("show");

    },2500);

}


function empresaActual(){

    if(!usuarioActual){
        return null;
    }

    return datos.empresas.find(
        e => e.id === usuarioActual.empresaId
    );

}


/* =========================================================
   LOGIN
   ========================================================= */

document
.getElementById("loginForm")
.addEventListener("submit",function(e){

    e.preventDefault();

    const usuario =
    document.getElementById("username")
    .value.trim();

    const password =
    document.getElementById("password")
    .value;

    let encontrado = null;

    if(
        usuario === "admin" &&
        password === "MercaCui2026"
    ){

        encontrado = {

            id:"admin",
            nombre:"Administrador General",
            usuario:"admin",
            rol:"admin"

        };

    }

    else if(
        usuario === "empresa" &&
        password === "1234"
    ){

        encontrado = {

            id:"empresaUser",
            nombre:"Empresa Demo",
            usuario:"empresa",
            rol:"empresa",
            empresaId:"empresa1"

        };

    }

    else{

        encontrado =
        datos.trabajadores.find(

            t =>
            t.usuario === usuario &&
            t.password === password

        );

        if(encontrado){

            encontrado.rol = "trabajador";

        }

    }


    if(!encontrado){

        mostrarToast(
            "Usuario o contraseña incorrectos"
        );

        return;

    }


    usuarioActual = encontrado;

    document
    .getElementById("login")
    .classList.add("hidden");

    document
    .getElementById("app")
    .classList.remove("hidden");


    document
    .getElementById("roleText")
    .textContent =
    obtenerNombreRol(encontrado.rol);


    construirMenu();

    mostrarPagina("inicio");

});


function obtenerNombreRol(rol){

    if(rol === "admin")
        return "Administrador general";

    if(rol === "empresa")
        return "Empresa";

    return "Trabajador";

}


function cerrarSesion(){

    usuarioActual = null;

    if(intervaloRuta)
        clearInterval(intervaloRuta);

    document
    .getElementById("app")
    .classList.add("hidden");

    document
    .getElementById("login")
    .classList.remove("hidden");

}


/* =========================================================
   MENÚ
   ========================================================= */

function construirMenu(){

    const sidebar =
    document.getElementById("sidebar");

    let html = "";


    if(usuarioActual.rol === "admin"){

        html += `
        <div class="sidebar-title">
        Administración
        </div>

        <button class="nav-button"
        onclick="mostrarPagina('inicio')">
        🏠 Inicio
        </button>

        <button class="nav-button"
        onclick="mostrarPagina('empresas')">
        🏢 Empresas
        </button>

        <button class="nav-button"
        onclick="mostrarPagina('trabajadores')">
        👥 Trabajadores
        </button>

        <button class="nav-button"
        onclick="mostrarPagina('rutas')">
        🛣️ Rutas
        </button>

        <button class="nav-button"
        onclick="mostrarPagina('puntos')">
        📍 Puntos
        </button>

        <button class="nav-button"
        onclick="mostrarPagina('descansos')">
        🧘 MercaDes
        </button>

        <button class="nav-button"
        onclick="mostrarPagina('capacitaciones')">
        🎓 MercaCap
        </button>

        <button class="nav-button"
        onclick="mostrarPagina('solicitudes')">
        📨 Solicitudes
        </button>
        `;

    }


    if(usuarioActual.rol === "empresa"){

        html += `
        <div class="sidebar-title">
        Mi empresa
        </div>

        <button class="nav-button"
        onclick="mostrarPagina('inicio')">
        🏠 Inicio
        </button>

        <button class="nav-button"
        onclick="mostrarPagina('trabajadores')">
        👥 Trabajadores
        </button>

        <button class="nav-button"
        onclick="mostrarPagina('rutas')">
        🛣️ Rutas
        </button>

        <button class="nav-button"
        onclick="mostrarPagina('puntos')">
        📍 Puntos
        </button>

        <button class="nav-button"
        onclick="mostrarPagina('descansos')">
        🧘 MercaDes
        </button>

        <button class="nav-button"
        onclick="mostrarPagina('capacitaciones')">
        🎓 MercaCap
        </button>

        <button class="nav-button"
        onclick="mostrarPagina('solicitudes')">
        📨 Solicitudes
        </button>
        `;

    }


    if(usuarioActual.rol === "trabajador"){

        html += `
        <div class="sidebar-title">
        Seguridad
        </div>

        <button class="nav-button"
        onclick="mostrarPagina('inicio')">
        🏠 Mi panel
        </button>

        <button class="nav-button"
        onclick="mostrarPagina('miRuta')">
        🛵 Mi ruta
        </button>

        <button class="nav-button"
        onclick="mostrarPagina('descansos')">
        🧘 MercaDes
        </button>

        <button class="nav-button"
        onclick="mostrarPagina('capacitaciones')">
        🎓 MercaCap
        </button>

        <button class="nav-button"
        onclick="mostrarPagina('notificaciones')">
        🔔 Notificaciones
        </button>

        <button class="nav-button"
        onclick="mostrarPagina('solicitudes')">
        📨 Quejas / Solicitudes
        </button>

        <button class="nav-button"
        onclick="mostrarPagina('proponerPunto')">
        📍 Proponer punto
        </button>
        `;

    }


    sidebar.innerHTML = html;

}


/* =========================================================
   NAVEGACIÓN
   ========================================================= */

function mostrarPagina(pagina){

    const content =
    document.getElementById("content");

    if(pagina === "inicio")
        paginaInicio(content);

    if(pagina === "empresas")
        paginaEmpresas(content);

    if(pagina === "trabajadores")
        paginaTrabajadores(content);

    if(pagina === "rutas")
        paginaRutas(content);

    if(pagina === "puntos")
        paginaPuntos(content);

    if(pagina === "descansos")
        paginaDescansos(content);

    if(pagina === "capacitaciones")
        paginaCapacitaciones(content);

    if(pagina === "solicitudes")
        paginaSolicitudes(content);

    if(pagina === "miRuta")
        paginaMiRuta(content);

    if(pagina === "notificaciones")
        paginaNotificaciones(content);

    if(pagina === "proponerPunto")
        paginaProponerPunto(content);

}


/* =========================================================
   INICIO
   ========================================================= */

function paginaInicio(content){

    const rutas =
    usuarioActual.rol === "trabajador"

    ? datos.rutas.filter(
        r => r.trabajadorId === usuarioActual.id
      )

    : usuarioActual.rol === "empresa"

    ? datos.rutas.filter(
        r => r.empresaId === usuarioActual.empresaId
      )

    : datos.rutas;


    const solicitudes =
    usuarioActual.rol === "trabajador"

    ? datos.solicitudes.filter(
        s => s.trabajadorId === usuarioActual.id
      )

    : datos.solicitudes.filter(
        s => s.estado === "Pendiente"
      );


    content.innerHTML = `

    <div class="page-header">

        <div>

            <h2>
            ${

/* =========================================================
   MAPA
   ========================================================= */

function iniciarMapa(){

    if(mapa){

        mapa.remove();

        mapa = null;

    }


    mapa =
    L.map("map")
    .setView(CARTAGENA,13);


    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom:19,
            attribution:"© OpenStreetMap"
        }
    ).addTo(mapa);


    capaMarcadores =
    L.layerGroup()
    .addTo(mapa);

}


/* =========================================================
   DIBUJAR RUTA
   ========================================================= */

async function dibujarRuta(ruta){

    if(!mapa)
        return;


    capaMarcadores.clearLayers();


    L.marker([
        ruta.inicioLat,
        ruta.inicioLng
    ])
    .addTo(capaMarcadores)
    .bindPopup(
        "🟢 Inicio: "
        + escapar(ruta.inicio)
    );


    L.marker([
        ruta.destinoLat,
        ruta.destinoLng
    ])
    .addTo(capaMarcadores)
    .bindPopup(
        "🔵 Destino: "
        + escapar(ruta.destino)
    );


    datos.puntos
    .filter(
        p =>
        p.estado === "Aprobado" &&
        (
            p.rutaId === ruta.id ||
            p.empresaId === ruta.empresaId
        )
    )
    .forEach(p => {

        let icono = "📍";

        if(p.tipo === "riesgo")
            icono = "🔴";

        if(p.tipo === "descanso")
            icono = "🟣";

        if(p.tipo === "venta")
            icono = "🟢";

        if(p.tipo === "reunion")
            icono = "🟠";


        L.marker([
            p.lat,
            p.lng
        ])
        .addTo(capaMarcadores)
        .bindPopup(
            `<strong>
            ${icono} ${escapar(p.nombre)}
            </strong>
            <br>
            ${escapar(p.descripcion)}
            `
        );

    });


    try{

        const url =
        `https://router.project-osrm.org/route/v1/driving/`+
        `${ruta.inicioLng},${ruta.inicioLat};`+
        `${ruta.destinoLng},${ruta.destinoLat}`+
        `?overview=full&geometries=geojson`;


        const respuesta =
        await fetch(url);


        const resultado =
        await respuesta.json();


        if(
            resultado.routes &&
            resultado.routes.length
        ){

            const r =
            resultado.routes[0];


            ruta.geometria =
            r.geometry.coordinates.map(
                punto => [
                    punto[1],
                    punto[0]
                ]
            );


            ruta.distancia =
            r.distance;


            ruta.duracion =
            r.duration;


            guardar();


            if(capaRuta)
                capaRuta.remove();


            capaRuta =
            L.polyline(
                ruta.geometria,
                {
                    color:"#0879e8",
                    weight:6
                }
            )
            .addTo(mapa);


            mapa.fitBounds(
                capaRuta.getBounds(),
                {
                    padding:[25,25]
                }
            );

        }

    }
    catch(error){

        const linea = [

            [
                ruta.inicioLat,
                ruta.inicioLng
            ],

            [
                ruta.destinoLat,
                ruta.destinoLng
            ]

        ];


        capaRuta =
        L.polyline(
            linea,
            {
                color:"#0879e8",
                weight:5,
                dashArray:"8 8"
            }
        )
        .addTo(mapa);

        mapa.fitBounds(
            capaRuta.getBounds(),
            {
                padding:[25,25]
            }
        );

    }

}


/* =========================================================
   INICIAR RUTA
   ========================================================= */

function iniciarRuta(){

    if(!rutaActual)
        return;


    if(
        !rutaActual.geometria ||
        !rutaActual.geometria.length
    ){

        mostrarToast(
            "Calculando la ruta..."
        );

        dibujarRuta(rutaActual)
        .then(
            iniciarRuta
        );

        return;

    }


    rutaActual.estado = "Activa";

    guardar();


    if(intervaloRuta)
        clearInterval(intervaloRuta);


    if(marcadorTrabajador)
        marcadorTrabajador.remove();


    let posicion = 0;


    marcadorTrabajador =
    L.marker(
        rutaActual.geometria[0]
    )
    .addTo(mapa)
    .bindPopup(
        "🛵 Posición del trabajador"
    );


    marcadorTrabajador.openPopup();


    intervaloRuta =
    setInterval(function(){

        if(
            posicion >=
            rutaActual.geometria.length - 1
        ){

            clearInterval(
                intervaloRuta
            );

            return;

        }


        posicion++;


        marcadorTrabajador.setLatLng(
            rutaActual.geometria[posicion]
        );


        mapa.panTo(
            rutaActual.geometria[posicion],
            {
                animate:true
            }
        );


    },1000);


    mostrarToast(
        "🛵 Ruta iniciada"
    );

}


/* =========================================================
   PAUSAR
   ========================================================= */

function pausarRuta(){

    if(intervaloRuta){

        clearInterval(
            intervaloRuta
        );

        intervaloRuta = null;

        mostrarToast(
            "Ruta pausada"
        );

    }

}


/* =========================================================
   FINALIZAR
   ========================================================= */

function finalizarRuta(){

    if(!rutaActual)
        return;


    if(intervaloRuta)
        clearInterval(
            intervaloRuta
        );


    intervaloRuta = null;

    rutaActual.estado = "Finalizada";

    guardar();


    mostrarToast(
        "🏁 Ruta finalizada"
    );

}


/* =========================================================
   GPS
   ========================================================= */

function obtenerGPS(){

    if(!navigator.geolocation){

        mostrarToast(
            "GPS no disponible"
        );

        return;

    }


    navigator.geolocation.getCurrentPosition(

        function(pos){

            const lat =
            pos.coords.latitude;

            const lng =
            pos.coords.longitude;


            if(marcadorTrabajador){

                marcadorTrabajador
                .setLatLng([lat,lng]);

            }

            else{

                marcadorTrabajador =
                L.marker([lat,lng])
                .addTo(mapa)
                .bindPopup(
                    "📍 Mi ubicación"
                );

            }


            mapa.setView(
                [lat,lng],
                16
            );


            mostrarToast(
                "GPS actualizado"
            );

        },

        function(){

            mostrarToast(
                "No fue posible obtener el GPS"
            );

        }

    );

}

            usuarioActual.rol !== "trabajador"
            &&
            s.estado === "Pendiente"

            ?

            <br><br>

            <button
            class="btn-green"
            onclick="resolverSolicitud('${s.id}','Aprobada')">

            : ""

        }

        </div>

        `).join("")

        :

        `<div class="card">

        </div>`

    }

/* =========================================================
   RESOLVER SOLICITUD
   ========================================================= */

function resolverSolicitud(
    solicitudId,
    estado
){

    const solicitud =
    datos.solicitudes.find(
        s => s.id === solicitudId
    );


    if(!solicitud)
        return;


    solicitud.estado = estado;


    datos.notificaciones.push({

        id:id(),

        trabajadorId:
        solicitud.trabajadorId,

        titulo:
        "Actualización de solicitud",

        mensaje:
        "Tu solicitud '"
        +
        solicitud.titulo
        +
        "' fue "
        +
        estado.toLowerCase()
        +
        "."

    });


    guardar();

    mostrarPagina(
        "solicitudes"
    );


    mostrarToast(
        "Solicitud actualizada."
    );

}
